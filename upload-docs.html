<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Upload Documents</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar"><a class="logo" href="register.html">Admission Portal</a><ul><li><a href="register.html">Registration</a></li><li><a class="active" href="upload-docs.html">Upload Documents</a></li><li><a href="edit-profile.html">Edit Profile</a></li><li><a href="logout.php">Logout</a></li></ul></nav>
<main class="container"><h2>Upload Documents</h2><p class="subtitle">Upload PDF or image files (maximum 5 MB each).</p><form id="uploadForm"><div class="form-group"><label for="document">Choose Document *</label><input id="document" name="document" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div><button class="btn full" type="submit">Upload Document</button><div id="message" class="message"></div></form><h3>Uploaded Documents</h3><ul id="documentList" class="doc-list"></ul></main>
<script>
const f=document.getElementById('uploadForm'),m=document.getElementById('message'),list=document.getElementById('documentList');async function loadDocs(){try{const r=await fetch('documents.php');const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Please log in to view documents.');list.replaceChildren();if(!d.documents.length){list.textContent='No documents uploaded yet.';return;}d.documents.forEach(doc=>{const li=document.createElement('li');li.textContent=doc.document_name+' — '+doc.upload_date;list.appendChild(li);});}catch(e){list.textContent=e.message||'Could not load documents.';}}loadDocs();f.addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('upload.php',{method:'POST',body:new FormData(f)});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Upload failed.');m.textContent=d.message;m.className='message ok';f.reset();loadDocs();}catch(x){m.textContent=x.message||'Request failed.';m.className='message error';}});
</script></body></html>
