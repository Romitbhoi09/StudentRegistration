<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up - Admission Portal</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar"><a class="logo" href="signup.html">Admission Portal</a><ul><li><a class="active" href="signup.html">Sign Up</a></li><li><a href="login.html">Login</a></li></ul></nav>
<main class="container"><h2>Student Sign Up</h2><p class="subtitle">Create an account to start your admission process.</p>
<form id="signupForm"><div class="form-group"><label for="email">Email Address *</label><input id="email" name="email" type="email" required placeholder="student@example.com"></div><div class="form-group"><label for="password">Password *</label><input id="password" name="password" type="password" minlength="6" required placeholder="At least 6 characters"></div><div class="form-group"><label for="confirmPassword">Confirm Password *</label><input id="confirmPassword" type="password" minlength="6" required></div><button class="btn full" type="submit">Create Account</button><div id="message" class="message"></div><div class="form-links">Already registered? <a href="login.html">Login here</a></div></form></main>
<script>
const form=document.getElementById('signupForm'), msg=document.getElementById('message');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='message';if(form.password.value!==form.confirmPassword.value){msg.textContent='Passwords do not match.';msg.className='message error';return;}try{const r=await fetch('signup.php',{method:'POST',body:new URLSearchParams({email:form.email.value,password:form.password.value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Signup failed.');msg.textContent=d.message;msg.className='message ok';form.reset();setTimeout(()=>location.href='login.html',1000);}catch(err){msg.textContent=err.message||'Request failed. Check Apache, database, and signup.php.';msg.className='message error';}});
</script></body></html>
