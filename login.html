<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Admission Portal</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar"><a class="logo" href="signup.html">Admission Portal</a><ul><li><a href="signup.html">Sign Up</a></li><li><a class="active" href="login.html">Login</a></li></ul></nav>
<main class="container"><h2>Student Login</h2><p class="subtitle">Log in to manage your admission details.</p><form id="loginForm"><div class="form-group"><label for="email">Email Address *</label><input id="email" type="email" required></div><div class="form-group"><label for="password">Password *</label><input id="password" type="password" required></div><button class="btn full" type="submit">Login</button><div id="message" class="message"></div><div class="form-links"><a href="forgot-password.html">Forgot password?</a><br><br>New student? <a href="signup.html">Create an account</a></div></form></main>
<script>
const f=document.getElementById('loginForm'),m=document.getElementById('message');f.addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('login.php',{method:'POST',body:new URLSearchParams({email:f.email.value,password:f.password.value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Login failed.');m.textContent='Login successful.';m.className='message ok';setTimeout(()=>location.href='register.html',600);}catch(x){m.textContent=x.message||'Request failed.';m.className='message error';}});
</script></body></html>
