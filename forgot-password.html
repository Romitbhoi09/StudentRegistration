<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar"><a class="logo" href="signup.html">Admission Portal</a><ul><li><a href="login.html">Login</a></li><li><a class="active" href="forgot-password.html">Forgot Password</a></li></ul></nav>
<main class="container"><h2>Reset Password</h2><p class="subtitle">Enter your registered email and choose a new password.</p><p class="small">Demo note: this local college project does not send email verification.</p><form id="resetForm"><div class="form-group"><label for="email">Registered Email *</label><input id="email" type="email" required></div><div class="form-group"><label for="password">New Password *</label><input id="password" type="password" minlength="6" required></div><div class="form-group"><label for="confirmPassword">Confirm New Password *</label><input id="confirmPassword" type="password" minlength="6" required></div><button class="btn full" type="submit">Update Password</button><div id="message" class="message"></div><div class="form-links"><a href="login.html">Back to Login</a></div></form></main>
<script>
const f=document.getElementById('resetForm'),m=document.getElementById('message');f.addEventListener('submit',async e=>{e.preventDefault();if(f.password.value!==f.confirmPassword.value){m.textContent='Passwords do not match.';m.className='message error';return;}try{const r=await fetch('forgot_password.php',{method:'POST',body:new URLSearchParams({email:f.email.value,password:f.password.value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Could not reset password.');m.textContent=d.message;m.className='message ok';setTimeout(()=>location.href='login.html',1200);}catch(x){m.textContent=x.message||'Request failed.';m.className='message error';}});
</script></body></html>
