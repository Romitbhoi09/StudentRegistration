<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Profile</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar"><a class="logo" href="register.html">Admission Portal</a><ul><li><a href="register.html">Registration</a></li><li><a href="upload-docs.html">Upload Documents</a></li><li><a class="active" href="edit-profile.html">Edit Profile</a></li><li><a href="logout.php">Logout</a></li></ul></nav>
<main class="container"><h2>Edit Profile</h2><p class="subtitle">Update your saved student information.</p><form id="profileForm"><div class="form-group"><label for="full_name">Full Name *</label><input id="full_name" required></div><div class="form-group"><label for="dob">Date of Birth</label><input id="dob" type="date"></div><div class="form-group"><label for="phone">Phone Number</label><input id="phone" type="tel" maxlength="20"></div><div class="form-group"><label for="course">Course</label><select id="course"><option value="">Select a course</option><option>BCA</option><option>BBA</option><option>B.Com</option><option>B.Sc</option><option>Other</option></select></div><div class="form-group"><label for="address">Address</label><textarea id="address"></textarea></div><button class="btn full" type="submit">Update Profile</button><div id="message" class="message"></div></form></main>
<script>
const f=document.getElementById('profileForm'),m=document.getElementById('message');async function load(){try{const r=await fetch('profile.php');const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Could not load profile.');const p=d.profile||{};['full_name','dob','phone','course','address'].forEach(k=>{if(p[k]!==null&&p[k]!==undefined&&f[k])f[k].value=p[k];});}catch(x){m.textContent=x.message||'Could not load profile.';m.className='message error';}}load();f.addEventListener('submit',async e=>{e.preventDefault();const data={full_name:f.full_name.value,dob:f.dob.value,phone:f.phone.value,course:f.course.value,address:f.address.value};try{const r=await fetch('profile.php',{method:'POST',body:new URLSearchParams(data)});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Could not update profile.');m.textContent=d.message;m.className='message ok';}catch(x){m.textContent=x.message||'Request failed.';m.className='message error';}});
</script></body></html>
